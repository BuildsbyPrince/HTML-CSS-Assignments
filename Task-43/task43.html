<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 43 - Grid & Flexbox Reference Landing Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    /* Flexbox for 1D Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: #1e293b;
      color: white;
    }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { color: white; text-decoration: none; }

    /* Flexbox for 1D Hero alignment */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px 32px;
      background: #e2e8f0;
      gap: 24px;
    }

    /* CSS Grid for 2D Feature Cards */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 40px 32px;
    }
    .card {
      border: 1px solid #cbd5e1;
      padding: 20px;
      border-radius: 8px;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <h2>BrandName</h2>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </header>

  <section class="hero">
    <div>
      <h1>Hybrid Flexbox & Grid Layout</h1>
      <p>I used Flexbox for the navbar and hero, and CSS Grid for the feature columns.</p>
    </div>
    <img src="https://picsum.photos/340/200" alt="Hero preview">
  </section>

  <section class="features-grid">
    <div class="card"><h3>Feature 1</h3><p>Grid column 1</p></div>
    <div class="card"><h3>Feature 2</h3><p>Grid column 2</p></div>
    <div class="card"><h3>Feature 3</h3><p>Grid column 3</p></div>
  </section>
</body>
</html>
