<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card Component</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    .product-card {
      position: relative;
      width: 260px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #16a34a;
      color: white;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
    .product-card img {
      width: 100%;
      border-radius: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="product-card">
    <span class="badge">SALE</span>
    <img src="https://picsum.photos/240/160" alt="Wireless Headphones">
    <h3>Wireless Headphones</h3>
    <p>$49.99</p>
    <button class="btn">Add to Cart</button>
  </div>
</body>
</html>
