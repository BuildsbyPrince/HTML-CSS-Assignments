<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 44 - Landing Page Skeleton & Base Desktop Styles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #1e293b; line-height: 1.6; }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: #0f172a;
      color: white;
    }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { color: white; text-decoration: none; }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 50px;
      background: #f8fafc;
      gap: 40px;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding: 50px;
    }
    .card {
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #0f172a;
      color: white;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo"><strong>LaunchPad</strong></div>
    <nav class="nav-links">
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Launch Your Project Faster</h1>
        <p>My semantic HTML skeleton with base desktop styles.</p>
        <a href="#features" class="btn">Get Started</a>
      </div>
      <img src="https://picsum.photos/420/260" alt="Dashboard preview">
    </section>

    <section id="features" class="features">
      <div class="card"><h3>Fast Setup</h3><p>Clean semantic HTML5 structure.</p></div>
      <div class="card"><h3>Modern Layout</h3><p>Built with Flexbox and CSS Grid.</p></div>
      <div class="card"><h3>Scalable</h3><p>Ready for responsive breakpoints.</p></div>
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 LaunchPad</p>
  </footer>
</body>
</html>
