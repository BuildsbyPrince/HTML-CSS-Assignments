<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Size Chart</title>
</head>
<body>
  <h1>Men's T-Shirt Size Chart</h1>
  <table border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th>Size</th>
        <th>Chest (Inches)</th>
        <th>Length (Inches)</th>
        <th>Shoulder (Inches)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Small (S)</td>
        <td>38</td>
        <td>26</td>
        <td>16.5</td>
      </tr>
      <tr>
        <td>Medium (M)</td>
        <td>40</td>
        <td>27</td>
        <td>17.5</td>
      </tr>
      <tr>
        <td>Large (L)</td>
        <td>42</td>
        <td>28</td>
        <td>18.5</td>
      </tr>
      <tr>
        <td>Extra Large (XL)</td>
        <td>44</td>
        <td>29</td>
        <td>19.5</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
